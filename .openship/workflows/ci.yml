name: CI

# Fast gates only: lint, typecheck, build, under a minute (Bikram, 2026-10-30: a run over 1 min is a
# red flag). No unit tests (2026-10-24). The UI smoke and the returning-user check run locally
# (`bun e2e/local.ts`), not here. Deploys are Cloudflare Workers Builds on push to main, which
# verify live and roll back (scripts/deploy.ts).
# Runs on OpenShip direct (controller openship): jobs go straight to our runners, not
# through GitHub's job queue (Bikram, 2026-11-04). OpenShip posts the PR check.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint + type + build
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: [self-hosted, openship, linux]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
          # No Actions cache server on OpenShip direct: a cache restore or save only fails after retries.
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run type-check
      # OpenShip reads a job's log 200 lines at a time, so a noisy build holds the check after the
      # job ends. Keep the log short.
      - name: bun run build
        run: |
          if ! bun run build > "$RUNNER_TEMP/build.log" 2>&1; then
            tail -n 200 "$RUNNER_TEMP/build.log"
            exit 1
          fi
          tail -n 20 "$RUNNER_TEMP/build.log"
