name: CI

# Fast gates only: lint, typecheck, build, under a minute (Bikram, 2026-10-30: a run over 1 min is a
# red flag). No unit tests (2026-10-24). The UI smoke and the returning-user check run locally
# (`bun e2e/local.ts`), not here. Deploys are Cloudflare Workers Builds on push to main, which
# verify live and roll back (scripts/deploy.ts).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint + type + build
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: [self-hosted, openship, linux]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run type-check
      - run: bun run build
